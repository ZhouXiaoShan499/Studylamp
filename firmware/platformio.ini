; PlatformIO project for the smart interaction desk lamp (MVP firmware)
; Target: YD-ESP32-S3-N16R8 (16 MB flash, 8 MB octal PSRAM)
;
; Build:  pio run -e lamp_s3
; Flash:  pio run -e lamp_s3 -t upload
; Serial: pio device monitor -b 115200

[env:lamp_s3]
; 钉死平台版本：espressif32 8.x 换到 Arduino 3.x，ledc/WiFi 等 API 有破坏性变更，
; 不钉版本时 CI 缓存一失效就会拉到 8.0.0 然后编不过（2026-11-12 实际踩到）。
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; 排除 bringup/（它自带 setup/loop，会和主 main.cpp 冲突）
build_src_filter = +<*> -<bringup/>

; 16 MB flash: OTA 双槽 + LittleFS 数据 + NVS。默认的 default.csv 只有 1.25 MB
; app 分区，带 WiFi/WebSockets 的语音固件约 1.4 MB，会直接超出。
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
; N16R8 = 16 MB QIO flash + 8 MB OPI PSRAM。云 ASR 的 85 KB 请求体必须走 ps_malloc，
; 不开这一行 allocBig 会退到碎片化的内部堆，跑到第 2~3 次就 [asr] oom。
board_build.arduino.memory_type = qio_opi

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DLAMP_USE_OLED=0
    -DLAMP_HAS_SERVOS=1
    -DLAMP_HAS_VOICE=1
    ; 板上只接了原生 USB（USB-Serial-JTAG）：Serial 映射到 HWCDC，否则日志走 UART0 看不见
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; PSRAM：云 ASR 的 WAV/body 缓冲区走 ps_malloc，Arduino 2.x 还要显式声明这一条
    -DBOARD_HAS_PSRAM
    ; 面包板：按键在 GPIO4、灯在 GPIO5。正式 PCB 请删掉这一行。
    -DLAMP_BOARD_BREADBOARD=1

lib_deps =
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    bblanchon/ArduinoJson @ ^7.0.0
    links2004/WebSockets @ ^2.4.1

; Uncomment when enabling the OLED UI (set -DLAMP_USE_OLED=1 as well):
;    adafruit/Adafruit SSD1306 @ ^2.5.7
;    adafruit/Adafruit GFX Library @ ^1.11.5

; ---------------------------------------------------------------------------
; 百炼云端两跳（provider=3）：语音走 qwen3-asr-flash，语义走 deepseek-v4.1-flash。
; 派生自 lamp_s3，只多一个编译宏；产物落在 .pio/build/lamp_s3_bailian/，
; 和 lamp_s3（默认 provider=1）互不覆盖，来回切换不用改任何文件。
;   pio run -e lamp_s3_bailian                # 只编译
;   pio run -e lamp_s3_bailian -t upload      # 编译 + 烧录
;   pio device monitor -b 115200
; 校验是否编对：grep -ac qwen3-asr-flash .pio/build/lamp_s3_bailian/firmware.elf
;   返回 1 = 百炼版；返回 0 = 宏没生效，编成 provider=1 了
; ---------------------------------------------------------------------------
[env:lamp_s3_bailian]
extends = env:lamp_s3
build_flags =
    ${env:lamp_s3.build_flags}
    -DLAMP_CLOUD_ASR_PROVIDER=3

; ---------------------------------------------------------------------------
; 腾讯云（provider=4）：一句话识别走 TC3 签名，语义走 TokenHub Bearer。
; 和上面两个环境的区别不只是域名——它强依赖系统时钟（TC3 要求 ±5 分钟），
; 开机 Wi-Fi 连上会自动 SNTP；没网就串口 `time <epoch>` 手填一个。
;   pio run -e lamp_s3_tencent                # 只编译
;   pio run -e lamp_s3_tencent -t upload      # 编译 + 烧录
; 上板第一步先跑签名自检（不联网、不需要 Key）：
;   串口敲  asr selftest      → PASS 才说明拼接顺序对，再去查网络和 Key
; 校验是否编对：
;   grep -ac sentencerecognition .pio/build/lamp_s3_tencent/firmware.elf
;   返回 1 = 腾讯版；返回 0 = 宏没生效，编成别的 provider 了
; ---------------------------------------------------------------------------
[env:lamp_s3_tencent]
extends = env:lamp_s3
build_flags =
    ${env:lamp_s3.build_flags}
    -DLAMP_CLOUD_ASR_PROVIDER=4

; ---------------------------------------------------------------------------
; 局域网离线版（PC 跑 Vosk，板子只负责采音和点灯）：LAMP_CLOUD_ASR=0
; 不联网、不花钱、不填 Key，但要求同网段有一台开着 voice_server.py 的 PC。
; 产物落在 .pio/build/lamp_s3_lan/，和 lamp_s3 / lamp_s3_bailian 互不覆盖。
;   pio run -e lamp_s3_lan                  # 只编译
;   pio run -e lamp_s3_lan -t upload        # 编译 + 烧录
; 注意：LAMP_CLOUD_ASR=0 时固件没有本地关键词匹配（voice_client.cpp 那段
; 被 #if LAMP_CLOUD_ASR 包住），点灯完全依赖服务端下发的 {"type":"cmd"}。
; 所以服务端必须带 --no-llm 启动，否则 Ollama 一挂灯就不动。
; ---------------------------------------------------------------------------
[env:lamp_s3_lan]
extends = env:lamp_s3
build_flags =
    ${env:lamp_s3.build_flags}
    -DLAMP_CLOUD_ASR=0

; ---------------------------------------------------------------------------
; Bring-up: 面包板最小验证，只跑 src/bringup/main.cpp
; HW-483 按键 -> GPIO4，HW-479 RGB 模块 G 通道 -> GPIO5，不依赖任何库。
;   pio run -e bringup -t upload
;   pio device monitor -b 115200
; 详见 docs/06-面包板点亮验证.md
; ---------------------------------------------------------------------------
[env:bringup]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<bringup/>
build_flags =
    -DCORE_DEBUG_LEVEL=0