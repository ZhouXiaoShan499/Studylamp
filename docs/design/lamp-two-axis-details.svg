<!-- ============ 04 校核 ============ -->
<line x1="700" y1="500" x2="1192" y2="500" stroke="#D3D1C7" stroke-width="0.8"/>
<text class="sec" x="700" y="528">04 校核与修订</text>
<text class="tm" x="1192" y="528" text-anchor="end">REV A vs SHEET 01</text>

<circle cx="706" cy="554" r="3.5" class="warn"/>
<text class="t1" x="722" y="558">⌀120 内壁仅 r57.6：电池角 60.5、喇叭外缘 61、配重角 58.3，三处全部干涉。</text>
<text class="t2" x="722" y="574">改 ⌀130（内壁 62.0）后余 1.0–3.7，高度 50 → 52。SHEET 01 该尺寸作废。</text>

<circle cx="706" cy="604" r="3.5" class="warn"/>
<text class="t1" x="722" y="608">配重 3 块 14 厚共 ≈540 g，倾覆余量 16%；SHEET 01 的 ≥400 g 偏小。</text>
<text class="t2" x="722" y="624">若改 12 厚则余量降到 4%，不可取。</text>

<circle cx="706" cy="654" r="3.5" class="warn"/>
<text class="t1" x="722" y="658">J1 舵机 40.5 高，穿透三层；底板需开 6 深沉槽，转盘开 ⌀62 让位。</text>
<text class="t2" x="722" y="674">舵机外形按 40×20×40.5 假设，BOM 未给型号，需先确认。</text>

<circle cx="706" cy="704" r="3.5" class="warn"/>
<text class="t1" x="722" y="708">灯环漏光：导光环与屏之间加 0.8 泡棉 + 黑色内壁挡圈，否则画面边缘发白。</text>

<circle cx="706" cy="754" r="3.5" class="warn"/>
<text class="t1" x="722" y="758">PETG 蠕变：舵机支架长期 40–50 °C，P03 / P07–P10 改 PA-CF 或 PLA+。</text>

<circle cx="706" cy="804" r="3.5" fill="#0F6E56"/>
<text class="t1" x="722" y="808">J4 扭矩需求 0.5 kg·cm（头 150 g × 30 mm），BOM 舵机余量 10 倍以上。</text>
<text class="t2" x="722" y="824">喇叭 ⌀28 已到环隙上限；要更大须把转盘压到 ⌀58，或改侧壁出声。</text>

<text class="t2" x="700" y="866">分件共 17 项 / 19 件 · 可打印清单见 docs/design/printable-parts.csv</text>
<text class="t2" x="700" y="884">打印参数：PETG 245/80 · 层高 0.2 · 4 圈壁 · 顶底 5 层 · 承力件 60% 填充</text>
</svg>
