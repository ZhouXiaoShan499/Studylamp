<text class="sp" x="478" y="419">逐层定位柱，屏靠 0.8 泡棉压紧</text>

<circle cx="460" cy="466" r="9" fill="#2C2C2A"/><text x="460" y="470" text-anchor="middle" font-size="9.5" fill="#F7F5F0">6</text>
<text class="nm" x="478" y="463">视窗压入前壳，凸面朝外</text>
<text class="sp" x="478" y="479">点胶固化 24h，唇顶高出 0.8</text>

<line x1="450" y1="512" x2="684" y2="512" stroke="#E3DFD4" stroke-width="1"/>
<text class="sec" x="450" y="540">三条校核</text>

<text class="nm" x="450" y="568">1　头颈全宽 116 = 26 + 2 + 80 + 2 + 6</text>
<text class="sp" x="450" y="584">装配后测 J4 两端同轴度 &#8804; 0.1，否则点头会摆头</text>

<text class="nm" x="450" y="616">2　承力件不用 PETG</text>
<text class="sp" x="450" y="632">P03 / P09 / P10 / P21 走 PA-CF，PETG 只做外壳</text>

<text class="nm" x="450" y="664">3　底座倾覆余量</text>
<text class="sp" x="450" y="680">头 60 g + 臂 90 g，重心偏 55，配重 540 g 余 16%</text>

<line x1="450" y1="706" x2="684" y2="706" stroke="#E3DFD4" stroke-width="1"/>
<text class="t2" x="450" y="730">P 编号对应 printable-parts.csv；</text>
<text class="t2" x="450" y="746">P18&#8211;P24 为 REV C 新增件号。</text>
<text class="t2" x="450" y="772">左列立柱按折断画出，实际长度</text>
<text class="t2" x="450" y="788">以 SHEET 01 总装图为准。</text>
<text class="t2" x="450" y="814">盘类零件按剖视表达，虚线为内孔投影。</text>

