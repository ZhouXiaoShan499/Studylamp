<!-- ===================== 03 分区 ===================== -->
<text class="sec" x="700" y="356">03 分区与做法</text>
<circle cx="712" cy="386" r="6" fill="#F4F0E7" stroke="#8E8A80" stroke-width="0.9"/>
<text class="kvt" x="728" y="390">r24&#8211;r40　白壳环面</text>
<text class="kv" x="866" y="390">PETG 喷哑光白，厚 3.0，外缘倒角 0.8</text>
<circle cx="712" cy="416" r="6" fill="#FBDC9E" stroke="#E9AE5C" stroke-width="0.9"/>
<text class="kvt" x="728" y="420">r14&#8211;r24　导光环</text>
<text class="kv" x="866" y="420">PC 乳白，带宽 10，雾度 40%，下沉 2.2</text>
<circle cx="712" cy="446" r="6" fill="#1A1A17" stroke="#5A5750" stroke-width="0.9"/>
<text class="kvt" x="728" y="450">r0&#8211;r14　视窗</text>
<text class="kv" x="866" y="450">PMMA 黑，凸面 4.8，顶点低于唇顶 0.8</text>
<circle cx="712" cy="476" r="6" fill="#14140F"/>
<text class="kvt" x="728" y="480">镜头 / 麦克风</text>
<text class="kv" x="866" y="480">&#8960;2.5 @ r31 十二点 · &#8960;1.0&#215;2 @ r32 下侧 &#177;45&#176;</text>

<!-- ===================== 04 参数 ===================== -->
<text class="sec" x="700" y="528">04 参数</text>
<line x1="700" y1="540" x2="1192" y2="540" stroke="#DDD9CE" stroke-width="1"/>
<text class="kv" x="700" y="568">头部外形</text><text class="kvt" x="852" y="568">&#8960;80 &#215; 26</text>
<text class="kv" x="700" y="598">白壳包边</text><text class="kvt" x="852" y="598">16（r24&#8594;r40）</text>
<text class="kv" x="700" y="628">导光环</text><text class="kvt" x="852" y="628">&#8960;28 &#8594; &#8960;48，带宽 10</text>
<text class="kv" x="700" y="658">视窗</text><text class="kvt" x="852" y="658">&#8960;28，凸面 4.8，沉入 0.8</text>
<text class="kv" x="700" y="688">轴向堆叠</text><text class="kvt" x="852" y="688">6.3 + 4.4 + 5.0 + 2.6 + 7.7 = 26.0</text>
<text class="kv" x="700" y="718">头部重量</text><text class="kvt" x="852" y="718">&#8776; 60 g（不含舵机）</text>
<text class="kv" x="700" y="748">灯环</text><text class="kvt" x="852" y="748">WS2812B 16 灯 &#8960;48 + 柔光罩</text>
<text class="kv" x="700" y="778">屏</text><text class="kvt" x="852" y="778">1.09&#8243; TFT，对角线 27.7，藏在 &#8960;28 视窗后</text>

<text class="t2" x="700" y="812">轴向堆叠按前&#8594;后：视窗 6.3 / 屏 4.4 / 主控 5.0 / 后壳 2.6，余 7.7 为走线与容差。</text>
<text class="t2" x="700" y="830">过去标 &#8960;40 视窗 + 4 宽细环，与实物观感不符；REV C 改为 &#8960;28 镜片 + 10 宽光环。</text>

