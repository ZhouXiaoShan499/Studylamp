name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-guard:
    name: 仓库卫生检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 本地凭据 / 构建产物 / 模型不应入库
        run: |
          set -uo pipefail
          fail=0

          if git ls-files --error-unmatch firmware/include/secrets.h >/dev/null 2>&1; then
            echo "::error file=firmware/include/secrets.h::secrets.h 是本地凭据，不能进仓库"
            fail=1
          fi

          bad=$(git ls-files | grep -Ei '(^|/)(\.pio|managed_components|models)/|(^|/)build/|\.wav$' || true)
          if [ -n "$bad" ]; then
            echo "::error::构建产物、第三方组件、模型或录音不应入库："
            echo "$bad"
            fail=1
          fi

          exit $fail

      - name: 扫描疑似云端 Key
        run: |
          set -uo pipefail
          # 真实 Key 形如 sk-xxxxxxxx（32 位）或 AKIDxxxxxxxx；文档里的 sk-xxx 占位符不会命中
          hits=$(git grep -nE '(sk-[A-Za-z0-9]{24,}|AKID[A-Za-z0-9]{16,})' -- . || true)
          if [ -n "$hits" ]; then
            echo "::error::发现疑似云端 Key，请改走 NVS 或本地 secrets.h"
            echo "$hits"
            exit 1
          fi

  python:
    name: Python 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: compileall
        run: python -m compileall -q server tools

  firmware:
    name: PlatformIO 全环境编译
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 PlatformIO
        run: python -m pip install --upgrade platformio

      - name: 逐个编译 platformio.ini 里的所有环境
        working-directory: firmware
        run: |
          set -euo pipefail
          # 新增 [env:xxx] 后无需改 CI，这里会自动带上（例如特性分支里的 lamp_s3_bailian）
          envs=$(grep -oP '(?<=^\[env:)[^]]+' platformio.ini)
          if [ -z "$envs" ]; then
            echo "::error::platformio.ini 里没有找到 [env:...] 配置"
            exit 1
          fi
          echo "待编译环境: $envs"
          for env in $envs; do
            echo "::group::pio run -e $env"
            python -m platformio run -e "$env"
            echo "::endgroup::"
          done